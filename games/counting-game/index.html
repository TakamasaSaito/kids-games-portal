<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">

<meta name="apple-mobile-web-app-capable" content="yes">

<title>いちにのぽん!</title>
<link rel="stylesheet" href="../../shared/game-shell.css?v=3">
<style>:root { --game-accent: #FF9F43; }</style>
<style>
/* ===== counting-game 固有 CSS ===== */

/* ===== GAME SCREEN ===== */
#screen-game {
  justify-content: space-between;
  padding-top: max(12px, env(safe-area-inset-top));
  padding-bottom: max(12px, env(safe-area-inset-bottom));
  gap: 1.5vmin;
}

.question-header {
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 2vmin;
  width: 100%;
  flex-shrink: 0;
}

.question-text {
  font-size: clamp(18px, 5vmin, 32px);
  font-weight: 900;
  color: var(--white);
  text-shadow: 0 2px 8px rgba(0,0,0,0.2);
}

/* ===== EMOJI FIELD ===== */
.emoji-field {
  position: relative;
  width: 100%;
  max-width: min(520px, 96vw);
  flex: 1;
  min-height: 0;
}

.emoji-item {
  touch-action: manipulation;
  position: absolute;
  width: 88px;
  height: 88px;
  display: flex;
  align-items: center;
  justify-content: center;
  cursor: pointer;
  -webkit-tap-highlight-color: transparent;
  transform: translate(-50%, -50%);
  border: none;
  background: none;
  border-radius: 50%;
  transition: opacity 0.25s;
}
.emoji-item.tapped {
  opacity: 0.35;
  pointer-events: none;
}
.emoji-item.bounce { animation: emoji-bounce 0.4s ease-out; }
@keyframes emoji-bounce {
  0%   { transform: translate(-50%, -50%) scale(1); }
  30%  { transform: translate(-50%, calc(-50% - 18px)) scale(1.3); }
  65%  { transform: translate(-50%, calc(-50% + 5px)) scale(0.93); }
  100% { transform: translate(-50%, -50%) scale(1); }
}

.count-badge {
  position: absolute;
  top: 4px;
  right: 4px;
  min-width: 22px;
  height: 22px;
  background: var(--accent);
  border-radius: 11px;
  font-size: 12px;
  font-weight: 900;
  color: var(--text-dark);
  display: flex;
  align-items: center;
  justify-content: center;
  padding: 0 4px;
  pointer-events: none;
  line-height: 1;
}

/* ===== ANSWER BUTTONS ===== */
.answer-row {
  display: flex;
  gap: clamp(8px, 2.5vmin, 20px);
  width: 100%;
  max-width: min(480px, 92vw);
  flex-shrink: 0;
}

.answer-btn {
  touch-action: manipulation;
  flex: 1;
  min-height: 88px;
  border-radius: 20px;
  font-size: clamp(30px, 10vmin, 64px);
  font-weight: 900;
  color: var(--text-dark);
  background: var(--white);
  border: 4px solid transparent;
  cursor: pointer;
  box-shadow: 0 4px 16px rgba(0,0,0,0.15), 0 2px 6px rgba(0,0,0,0.1);
  transition: transform 0.1s;
  -webkit-tap-highlight-color: transparent;
  display: flex;
  align-items: center;
  justify-content: center;
}
.answer-btn:active { transform: scale(0.92); }
.answer-btn.disabled { pointer-events: none; }

.answer-btn.correct {
  animation: bounce 0.5s ease-out;
  background: #FECA57;
  border-color: #f39c12;
}
@keyframes bounce {
  0%   { transform: scale(1); }
  30%  { transform: scale(1.25); }
  60%  { transform: scale(0.95); }
  80%  { transform: scale(1.08); }
  100% { transform: scale(1); }
}

.answer-btn.wrong { animation: shake 0.4s ease-out; }
@keyframes shake {
  0%   { transform: translateX(0); }
  20%  { transform: translateX(-8px); }
  40%  { transform: translateX(8px); }
  60%  { transform: translateX(-5px); }
  80%  { transform: translateX(5px); }
  100% { transform: translateX(0); }
}

.answer-btn.hint-pulse {
  animation: pulse-hint 1.5s ease-in-out infinite;
  border-color: #FECA57;
}
@keyframes pulse-hint {
  0%, 100% { box-shadow: 0 4px 16px rgba(0,0,0,0.15), 0 0 0 0 rgba(254,202,87,0.7); }
  50%       { box-shadow: 0 4px 16px rgba(0,0,0,0.15), 0 0 0 12px rgba(254,202,87,0); }
}

/* ===== 親メニュー統計 (counting-game 固有) ===== */
.num-stats-label {
  font-size: clamp(12px, 2.8vmin, 14px);
  font-weight: 700;
  color: #636e72;
  align-self: flex-start;
  margin-top: 0.3em;
}

.number-stats-grid {
  display: grid;
  grid-template-columns: repeat(5, 1fr);
  gap: 5px;
  width: 100%;
}

.num-stat-cell {
  display: flex;
  flex-direction: column;
  align-items: center;
  background: #f8f9fa;
  border-radius: 10px;
  padding: 5px 2px 4px;
  gap: 1px;
}
.num-label {
  font-size: clamp(16px, 4vmin, 20px);
  font-weight: 900;
  color: var(--text-dark);
  line-height: 1;
}
.num-pct {
  font-size: clamp(9px, 2.2vmin, 11px);
  color: #636e72;
  line-height: 1;
}

/* reduced motion (counting-game 固有アニメ) */
@media (prefers-reduced-motion: reduce) {
  .answer-btn.correct,
  .answer-btn.wrong,
  .answer-btn.hint-pulse,
  .emoji-item.bounce {
    animation: none !important;
    transition: none !important;
  }
}

/* landscape adjustments (small phones) */
@media (orientation: landscape) and (max-height: 500px) {
  #screen-game { flex-direction: row; flex-wrap: wrap; padding: 6px 12px; gap: 6px; }
  .question-header { width: 28%; flex-direction: column; justify-content: center; min-height: 0; }
  .emoji-field { flex: 1; }
  .answer-row { width: 100%; }
  .progress-area { width: 100%; padding: 0.2em; }
}
</style>
</head>
<body>

<!-- SPLASH SCREEN -->
<div id="screen-splash" class="screen active">
  <span class="splash-fox" aria-hidden="true">🦊</span>
  <div class="splash-title">いちにの<br>ぽん!</div>
</div>

<!-- START SCREEN -->
<div id="screen-start" class="screen">
  <span class="character-idle" id="char-start" aria-hidden="true">🦊</span>
  <div class="app-title">いちにの<br>ぽん!</div>
  <div class="app-subtitle">かずをかぞえてみよう！</div>
  <button class="btn-primary" id="btn-start" aria-label="はじめる">はじめる</button>
  <button class="gear-btn" id="btn-gear" aria-label="せってい">⚙
    <svg class="gear-ring" viewBox="0 0 54 54" aria-hidden="true">
      <circle class="gear-ring-fill" cx="27" cy="27" r="27"/>
    </svg>

<!-- GAME SCREEN -->
<div id="screen-game" class="screen">
  <button class="home-btn" id="btn-home-game" aria-label="ホームにもどる">🏠</button>
  <div class="question-header">
    <span class="question-text">ぜんぶで いくつかな？</span>
    <button class="speak-btn" id="btn-speak" aria-label="もういちどよむ">🔊</button>

<!-- CLEAR SCREEN -->
<div id="screen-clear" class="screen">
  <div class="clear-title">すごい！</div>
  <div class="clear-character" aria-hidden="true">🦊✨</div>
  <div class="clear-subtitle" id="clear-subtitle">10もん ぜんぶ できたね！</div>

</div>

<!-- PARENT MENU MODAL -->
<div class="modal-overlay" id="modal-parent">
  <div class="modal-box">
    <div class="modal-title">⚙ せってい（おとなむけ）</div>
    <div class="parent-stats-area" id="parent-stats"></div>
    <div class="volume-toggle">
      <span>おと</span>
      <button class="toggle-switch on" id="toggle-volume" aria-label="音量切り替え"></button>
      <span id="volume-label">オン</span>
    </div>
    <button class="btn-modal danger" id="btn-reset-confirm" style="width:100%">しんちょくをリセット</button>
    <button class="btn-modal cancel" id="btn-parent-close" style="width:100%">とじる</button>
    <div class="modal-credit">音声: VOICEVOX / ずんだもん（あまあま）<br>© SSS合同会社</div>
  </div>
</div>

<!-- RESET CONFIRM MODAL -->
<div class="modal-overlay" id="modal-reset">
  <div class="modal-box">
    <div class="modal-title">リセットしますか？</div>
    <div class="modal-body">ゲームのしんちょくが すべてきえます。</div>
    <div class="modal-row">
      <button class="btn-modal danger" id="btn-reset-do">リセット</button>
      <button class="btn-modal cancel" id="btn-reset-cancel">もどる</button>
    </div>
  </div>
</div>

<script src="../../shared/audio-engine.js?v=3"></script>
<script src="../../shared/audio-player.js?v=3"></script>
<script src="../../shared/speech.js?v=3"></script>
<script src="../../shared/game-state.js?v=3"></script>
<script src="../../shared/ui-common.js?v=3"></script>
<script>
'use strict';

// ===== CONSTANTS =====
const EMOJI_POOLS = {
  fruits:   ['🍎','🍌','🍓','🍊','🍇','🍑','🍰','🍩'],
  animals:  ['🐶','🐱','🐰','🐼','🐸','🐥','🐟','🦋'],
  vehicles: ['🚗','🚌','🚒','🚑','🚀','⛵','🚲','🚁'],
};
const EMOJI_CATEGORIES  = Object.keys(EMOJI_POOLS);
const COUNT_WORDS       = ['いち','に','さん','し','ご','ろく','しち','はち','きゅう','じゅう'];
const QUESTIONS_PER_SET = 10;
const HINT_THRESHOLD    = 3;
const NEXT_DELAY        = 2000;
const STORAGE_KEY       = 'counting-game-v1';
const ANSWER_COLORS     = ['#FF6B6B','#48DBFB','#1DD1A1'];

const PRELOAD_FILES = ['../../shared/audio/se/question.wav','praise_1.wav','../../shared/audio/se/praise_2.wav','../../shared/audio/se/praise_3.wav','hint.wav','../../shared/audio/se/clear.wav'];

// ===== GAME-SPECIFIC EXTENSIONS =====
// playPop: 絵文字タップ時の効果音 (shared AudioEngine に追加)
// 専用の AudioContext を遅延初期化して再利用する
AudioEngine.playPop = (() => {
  let ctx = null, gain = null;
  return function() {
    if (!AudioEngine.isEnabled()) return;
    if (!ctx) {
      try {
        ctx  = new (window.AudioContext || window.webkitAudioContext)();
        gain = ctx.createGain();
        gain.gain.value = 0.5;
        gain.connect(ctx.destination);
      } catch (e) { return; }
    }
    if (ctx.state === 'suspended') ctx.resume().catch(() => {});
    try {
      const osc = ctx.createOscillator();
      const g   = ctx.createGain();
      osc.connect(g);
      g.connect(gain);
      osc.type = 'sine';
      osc.frequency.setValueAtTime(900, ctx.currentTime);
      g.gain.setValueAtTime(0.15, ctx.currentTime);
      g.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + 0.07);
      osc.start(ctx.currentTime);
      osc.stop(ctx.currentTime + 0.07);
    } catch (e) {}
  };
})();

// countPool: count_1.wav〜count_10.wav 専用チャンネル
const countPool = new Map();
for (let i = 1; i <= 10; i++) {
  const a = new Audio();
  a.preload = 'auto';
  a.src = `audio/count_${i}.wav`;
  countPool.set(i, a);
}

// AudioPlayer.unlock を拡張して countPool も解除する
const _origUnlock = AudioPlayer.unlock.bind(AudioPlayer);
AudioPlayer.unlock = function() {
  _origUnlock();
  countPool.forEach(a => { if (a.readyState === 0) a.load(); });
};

// AudioPlayer.playCount: countPool 経由で再生
AudioPlayer.playCount = function(n, fallback) {
  countPool.forEach(a => { if (!a.paused) { a.pause(); a.currentTime = 0; } });
  const a = countPool.get(n);
  if (!a) { fallback && fallback(); return; }
  a.currentTime = 0;
  const p = a.play();
  if (p) p.catch(err => {
    if (err && err.name === 'AbortError') return;
    fallback && fallback();
  });
};

// Speech.speakCount: カウント数を読み上げ (shared Speech に追加)
Speech.speakCount = function(n) {
  if (!AudioEngine.isEnabled()) return;
  AudioPlayer.playCount(n, () => {
    if (!('speechSynthesis' in window)) return;
    try {
      speechSynthesis.cancel();
      const u = new SpeechSynthesisUtterance(COUNT_WORDS[n - 1]);
      u.lang = 'ja-JP';
      speechSynthesis.speak(u);
    } catch (e) {}
  });
};

// ===== GAME STATE =====
const GameState = createGameState(STORAGE_KEY, () => {
  const numberStats = {};
  for (let i = 1; i <= 10; i++) numberStats[i] = { asked: 0, correct: 0 };
  return { totalCorrect: 0, setClearCount: 0, numberStats };
});

// ===== QUESTION GENERATOR =====
const QuestionGenerator = (() => {
  function shuffle(arr) {
    const a = [...arr];
    for (let i = a.length - 1; i > 0; i--) {
      const j = Math.floor(Math.random() * (i + 1));
      [a[i], a[j]] = [a[j], a[i]];
    }
    return a;
  }

  function pick(arr) { return arr[Math.floor(Math.random() * arr.length)]; }

  function makeCategorySeq() {
    const seq = [];
    EMOJI_CATEGORIES.forEach((cat, i) => {
      const n = i === 0 ? 4 : 3;
      for (let j = 0; j < n; j++) seq.push(cat);
    });
    return shuffle(seq);
  }

  function makeChoices(n) {
    const candidates = [];
    for (let d = 1; d <= 3 && candidates.length < 4; d++) {
      if (n - d >= 1) candidates.push(n - d);
      if (n + d <= 10) candidates.push(n + d);
    }
    return shuffle([n, ...candidates.slice(0, 2)]);
  }

  function computePositions(count, fieldW, fieldH) {
    const ITEM_HALF = 44;
    const cols = Math.max(2, Math.min(5, Math.ceil(Math.sqrt(count * fieldW / Math.max(fieldH, 1)))));
    const rows = Math.ceil(count / cols);
    const cellW = fieldW / cols;
    const cellH = fieldH / rows;
    const cells = [];
    for (let r = 0; r < rows; r++) {
      for (let c = 0; c < cols; c++) cells.push({ c, r });
    }
    const chosen = shuffle(cells).slice(0, count);
    const jx = Math.max(0, (cellW / 2 - ITEM_HALF) * 0.7);
    const jy = Math.max(0, (cellH / 2 - ITEM_HALF) * 0.7);
    return chosen.map(({ c, r }) => {
      const cx = (c + 0.5) * cellW;
      const cy = (r + 0.5) * cellH;
      const x = Math.min(fieldW - ITEM_HALF, Math.max(ITEM_HALF, cx + (Math.random() - 0.5) * 2 * jx));
      const y = Math.min(fieldH - ITEM_HALF, Math.max(ITEM_HALF, cy + (Math.random() - 0.5) * 2 * jy));
      return { x, y };
    });
  }

  function generate(questionIndex, prevN, categorySeq) {
    let n, tries = 0;
    do {
      n = Math.floor(Math.random() * 10) + 1;
      tries++;
    } while (n === prevN && tries < 20);
    const category = categorySeq[questionIndex % categorySeq.length];
    const emoji    = pick(EMOJI_POOLS[category]);
    const choices  = makeChoices(n);
    return { n, emoji, choices };
  }

  return { makeCategorySeq, generate, computePositions };
})();

// ===== GAME LOGIC =====
let state   = null;
let session = {};

function startGame() {
  session = {
    questionIndex: 0,
    wrongCount:    0,
    prevN:         null,
    locked:        false,
    n:             null,
    tapCount:      0,
    hintShown:     false,
    categorySeq:   QuestionGenerator.makeCategorySeq(),
  };
  UICommon.showScreen('game');
  nextQuestion();
}

function nextQuestion() {
  session.locked     = false;
  session.wrongCount = 0;
  session.tapCount   = 0;
  session.hintShown  = false;

  const { n, emoji, choices } = QuestionGenerator.generate(
    session.questionIndex, session.prevN, session.categorySeq
  );
  session.n    = n;
  session.prevN = n;

  state.numberStats[n].asked++;
  GameState.save(state);

  UICommon.renderProgress(session.questionIndex, QUESTIONS_PER_SET);
  renderAnswerButtons(choices);

  requestAnimationFrame(() => { renderEmojiField(n, emoji); });

  Speech.speak('ぜんぶで いくつかな', '../../shared/audio/se/question.wav');
}

function emojiSize(n) {
  if (n <= 3) return '60px';
  if (n <= 6) return '50px';
  return '40px';
}

function renderEmojiField(n, emoji) {
  const field = document.getElementById('emoji-field');
  field.innerHTML = '';
  const { width: W, height: H } = field.getBoundingClientRect();
  if (W === 0 || H === 0) { setTimeout(() => renderEmojiField(n, emoji), 50); return; }
  const positions = QuestionGenerator.computePositions(n, W, H);
  const fsize     = emojiSize(n);

  positions.forEach((pos, i) => {
    const btn = document.createElement('button');
    btn.className = 'emoji-item';
    btn.style.left = pos.x + 'px';
    btn.style.top  = pos.y + 'px';
    btn.style.fontSize = fsize;
    btn.setAttribute('aria-label', emoji);
    btn.dataset.index = i;

    const span = document.createElement('span');
    span.textContent = emoji;
    btn.appendChild(span);

    btn.addEventListener('click', () => onEmojiTap(btn));
    field.appendChild(btn);
  });
}

function onEmojiTap(btn) {
  if (session.locked) return;
  if (btn.classList.contains('tapped')) return;
  session.tapCount++;
  const tapNum = session.tapCount;
  btn.classList.add('tapped');

  const badge = document.createElement('span');
  badge.className = 'count-badge';
  badge.textContent = tapNum;
  btn.appendChild(badge);

  btn.classList.add('bounce');
  setTimeout(() => btn.classList.remove('bounce'), 450);

  AudioEngine.playPop();
  Speech.speakCount(tapNum);
}

function renderAnswerButtons(choices) {
  const row = document.getElementById('answer-row');
  row.innerHTML = '';
  choices.forEach((num, i) => {
    const btn = document.createElement('button');
    btn.className = 'answer-btn';
    btn.textContent = num;
    btn.style.borderColor = ANSWER_COLORS[i % ANSWER_COLORS.length];
    btn.dataset.num = num;
    btn.addEventListener('click', () => onAnswerTap(btn, num));
    row.appendChild(btn);
  });
}

function onAnswerTap(btn, num) {
  if (session.locked) return;
  if (num === session.n) onCorrect(btn, num);
  else                   onWrong(btn);
}

function onCorrect(btn, num) {
  session.locked = true;
  document.getElementById('answer-row').querySelectorAll('.answer-btn')
    .forEach(b => b.classList.add('disabled'));
  btn.classList.add('correct');

  AudioEngine.playCorrect();
  UICommon.spawnStars(btn);
  UICommon.jumpCharacter();

  if (session.wrongCount === 0) {
    state.numberStats[num].correct++;
  }
  state.totalCorrect++;
  GameState.save(state);

  const praiseIdx = Math.floor(Math.random() * 3) + 1;
  const praises   = ['できたね！', 'すごい！', 'やったね！'];
  const praiseFile = praiseIdx === 1 ? 'praise_1.wav' : `../../shared/audio/se/praise_${praiseIdx}.wav`;
  Speech.speak(praises[praiseIdx - 1], praiseFile);

  session.questionIndex++;
  UICommon.renderProgress(session.questionIndex, QUESTIONS_PER_SET);

  if (session.questionIndex >= QUESTIONS_PER_SET) {
    state.setClearCount++;
    GameState.save(state);
    setTimeout(showClear, NEXT_DELAY);
  } else {
    setTimeout(nextQuestion, NEXT_DELAY);
  }
}

function onWrong(btn) {
  btn.classList.add('wrong');
  AudioEngine.playWrong();
  setTimeout(() => btn.classList.remove('wrong'), 450);
  session.wrongCount++;
  if (session.wrongCount >= HINT_THRESHOLD && !session.hintShown) showHint();
}

function showHint() {
  session.hintShown = true;
  document.getElementById('answer-row').querySelectorAll('.answer-btn').forEach(b => {
    if (parseInt(b.dataset.num) === session.n) b.classList.add('hint-pulse');
  });
  Speech.speak('もういちど かぞえてみよう', 'hint.wav');
}

function showClear() {
  AudioEngine.playClear();
  Speech.speak('ぜんぶ できたね！', '../../shared/audio/se/clear.wav');
  UICommon.spawnConfetti();
  document.getElementById('clear-subtitle').textContent = '10もん ぜんぶ できたね！';
  UICommon.showScreen('clear');
}

function renderParentStats() {
  const el = document.getElementById('parent-stats');
  if (!el) return;
  const totalAsked = Object.values(state.numberStats).reduce((s, v) => s + v.asked, 0);
  const totalFirst = Object.values(state.numberStats).reduce((s, v) => s + v.correct, 0);
  const accuracy   = totalAsked > 0 ? Math.round(totalFirst / totalAsked * 100) : 0;

  let html = `
    <div class="stat-row"><span>せいかい（のべ）</span><strong>${state.totalCorrect}もん</strong></div>
    <div class="stat-row"><span>クリア</span><strong>${state.setClearCount}かい</strong></div>
    <div class="stat-row"><span>1かいめせいかいりつ</span><strong>${accuracy}%</strong></div>
    <div class="num-stats-label">かずべつ せいかいりつ（1かいめ）</div>
    <div class="number-stats-grid">`;
  for (let n = 1; n <= 10; n++) {
    const ns  = state.numberStats[n];
    const pct = ns.asked > 0 ? Math.round(ns.correct / ns.asked * 100) + '%' : '-';
    html += `<div class="num-stat-cell">
      <span class="num-label">${n}</span>
      <span class="num-pct">${pct}</span>
    </div>`;
  }
  html += '</div>';
  el.innerHTML = html;
}
