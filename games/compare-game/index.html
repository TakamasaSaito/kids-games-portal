<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="くらべっこ">
<link rel="apple-touch-icon" href="icons/icon-180.png">
<link rel="icon" href="icons/icon-512.png">
<title>くらべっこ</title>
<link rel="stylesheet" href="../../shared/game-shell.css?v=1">
<style>
/* ===== compare-game 固有 CSS ===== */
:root {
  --card-left:  #FF6B6B;
  --card-right: #54A0FF;
}

/* ===== GAME SCREEN ===== */
#screen-game {
  justify-content: space-between;
  padding-top: max(52px, calc(env(safe-area-inset-top) + 48px));
  padding-bottom: max(12px, env(safe-area-inset-bottom));
  gap: 2vmin;
}

.question-header {
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 2vmin;
  width: 100%;
  flex-shrink: 0;
}

.question-text {
  font-size: clamp(18px, 5vmin, 34px);
  font-weight: 900;
  color: var(--white);
  text-shadow: 0 2px 8px rgba(0,0,0,0.2);
}

/* ===== COMPARE CARDS ===== */
.compare-area {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: clamp(8px, 3vmin, 20px);
  width: 100%;
  max-width: min(600px, 96vw);
  flex: 1;
  min-height: 0;
  padding: 0 2vmin;
  align-content: center;
  align-items: center;
}

.compare-card {
  touch-action: manipulation;
  background: var(--white);
  border-radius: 20px;
  border: 4px solid transparent;
  display: flex;
  align-items: center;
  justify-content: center;
  flex-direction: column;
  cursor: pointer;
  -webkit-tap-highlight-color: transparent;
  box-shadow: 0 4px 16px rgba(0,0,0,0.15), 0 2px 6px rgba(0,0,0,0.1);
  transition: transform 0.1s;
  padding: clamp(8px, 2vmin, 16px);
  gap: 1vmin;
  min-height: 88px;
  aspect-ratio: 4 / 5;
  width: 100%;
}
.compare-card:active { transform: scale(0.95); }
.compare-card.disabled { pointer-events: none; }

#card-left  { border-color: var(--card-left); }
#card-right { border-color: var(--card-right); }

/* length観点: 上下並び・左端揃え(定規比較レイアウト) */
.compare-area.length-layout {
  grid-template-columns: 1fr;
  gap: clamp(6px, 2vmin, 12px);
}
.compare-area.length-layout .compare-card {
  aspect-ratio: auto;
  align-items: flex-start;
  min-height: 88px;
}

.compare-card.correct {
  animation: card-bounce 0.5s ease-out;
  background: #FECA57;
}
@keyframes card-bounce {
  0%   { transform: scale(1); }
  30%  { transform: scale(1.08); }
  60%  { transform: scale(0.97); }
  80%  { transform: scale(1.04); }
  100% { transform: scale(1); }
}

.compare-card.wrong { animation: shake 0.4s ease-out; }
@keyframes shake {
  0%   { transform: translateX(0); }
  20%  { transform: translateX(-8px); }
  40%  { transform: translateX(8px); }
  60%  { transform: translateX(-5px); }
  80%  { transform: translateX(5px); }
  100% { transform: translateX(0); }
}

.compare-card.hint-pulse {
  animation: pulse-hint 1.5s ease-in-out infinite;
}
@keyframes pulse-hint {
  0%, 100% { box-shadow: 0 4px 16px rgba(0,0,0,0.15), 0 0 0 0 rgba(254,202,87,0.8); }
  50%       { box-shadow: 0 4px 16px rgba(0,0,0,0.15), 0 0 0 14px rgba(254,202,87,0); }
}

.card-emoji {
  line-height: 1;
  display: block;
  text-align: center;
}

/* ===== 親メニュー統計 (compare-game 固有) ===== */
.type-stats-label {
  font-size: clamp(12px, 2.8vmin, 14px);
  font-weight: 700;
  color: #636e72;
  align-self: flex-start;
  margin-top: 0.3em;
}

.type-stats-grid {
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 6px;
  width: 100%;
}

.type-stat-cell {
  display: flex;
  flex-direction: column;
  align-items: center;
  background: #f8f9fa;
  border-radius: 10px;
  padding: 6px 4px;
  gap: 2px;
}
.type-label {
  font-size: clamp(10px, 2.5vmin, 12px);
  font-weight: 700;
  color: #636e72;
}
.type-pct {
  font-size: clamp(14px, 3.5vmin, 18px);
  font-weight: 900;
  color: var(--text-dark);
}

/* reduced motion (compare-game 固有アニメ) */
@media (prefers-reduced-motion: reduce) {
  .compare-card.correct,
  .compare-card.wrong,
  .compare-card.hint-pulse {
    animation: none !important;
    transition: none !important;
  }
}

/* landscape small phones */
@media (orientation: landscape) and (max-height: 500px) {
  #screen-game {
    padding-top: max(8px, env(safe-area-inset-top));
    padding-bottom: max(8px, env(safe-area-inset-bottom));
    gap: 1vmin;
  }
  .question-header { flex-shrink: 0; }
  .character-game  { display: none; }
}
</style>
</head>
<body>

<!-- SPLASH SCREEN -->
<div id="screen-splash" class="screen active">
  <span class="splash-fox" aria-hidden="true">🦊</span>
  <div class="splash-title">くらべっこ</div>
</div>

<!-- START SCREEN -->
<div id="screen-start" class="screen">
  <span class="character-idle" id="char-start" aria-hidden="true">🦊</span>
  <div class="app-title">くらべっこ</div>
  <div class="app-subtitle">どっちが おおきいかな？</div>
  <button class="btn-primary" id="btn-start" aria-label="はじめる">はじめる</button>
  <button class="gear-btn" id="btn-gear" aria-label="せってい">⚙
    <svg class="gear-ring" viewBox="0 0 54 54" aria-hidden="true">
      <circle class="gear-ring-fill" cx="27" cy="27" r="27"/>
    </svg>
  </button>
</div>

<!-- GAME SCREEN -->
<div id="screen-game" class="screen">
  <button class="home-btn" id="btn-home-game" aria-label="ホームにもどる">🏠</button>
  <div class="question-header">
    <span class="question-text" id="question-text">おおきいのはどっち？</span>
    <button class="speak-btn" id="btn-speak" aria-label="もういちどよむ">🔊</button>
    <span class="character-game" id="char-game" aria-hidden="true">🦊</span>
  </div>
  <div class="compare-area" id="compare-area">
    <button class="compare-card" id="card-left"  aria-label="ひだり"></button>

</div>

<!-- CLEAR SCREEN -->
<div id="screen-clear" class="screen">
  <div class="clear-title">すごい！</div>
  <div class="clear-character" aria-hidden="true">🦊✨</div>
  <div class="clear-subtitle">10もん ぜんぶ できたね！</div>
  <div class="clear-buttons">
    <button class="btn-primary"   id="btn-next" style="width:100%">もういちど</button>
    <button class="btn-secondary" id="btn-quit" style="width:100%">おわる</button>
  </div>
  <div class="confetti-container" id="confetti-container"></div>
</div>

<!-- PARENT MENU MODAL -->
<div class="modal-overlay" id="modal-parent">
  <div class="modal-box">
    <div class="modal-title">⚙ せってい（おとなむけ）</div>
    <div class="parent-stats-area" id="parent-stats"></div>
    <div class="volume-toggle">
      <span>おと</span>
      <button class="toggle-switch on" id="toggle-volume" aria-label="音量切り替え"></button>
      <span id="volume-label">オン</span>
    </div>
    <button class="btn-modal danger" id="btn-reset-confirm" style="width:100%">しんちょくをリセット</button>
    <button class="btn-modal cancel" id="btn-parent-close" style="width:100%">とじる</button>
    <div class="modal-credit">音声: VOICEVOX / ずんだもん（あまあま）<br>© SSS合同会社</div>
  </div>
</div>

<!-- RESET CONFIRM MODAL -->
<div class="modal-overlay" id="modal-reset">
  <div class="modal-box">
    <div class="modal-title">リセットしますか？</div>
    <div class="modal-body">ゲームのしんちょくが すべてきえます。</div>
    <div class="modal-row">
      <button class="btn-modal danger" id="btn-reset-do">リセット</button>
      <button class="btn-modal cancel" id="btn-reset-cancel">もどる</button>
    </div>
  </div>
</div>

<script src="../../shared/audio-engine.js?v=1"></script>
<script src="../../shared/audio-player.js?v=1"></script>
<script src="../../shared/speech.js?v=1"></script>
<script src="../../shared/game-state.js?v=1"></script>
<script src="../../shared/ui-common.js?v=1"></script>
<script>
'use strict';

// ===== CONSTANTS =====
const QUESTIONS_PER_SET = 10;
const HINT_THRESHOLD   = 3;
const NEXT_DELAY       = 2000;
const STORAGE_KEY      = 'compare-game-v1';

const PRELOAD_FILES = [
  'q_size_big.wav', 'q_size_small.wav',
  'q_length_long.wav', 'q_length_short.wav',
  'q_count_many.wav', 'q_count_few.wav',
  'praise_1.wav', 'praise_2.wav', 'praise_3.wav',
  'hint.wav', 'clear.wav',
];

// ===== GAME STATE =====
const GameState = createGameState(STORAGE_KEY, () => ({
  totalCorrect:  0,
  setClearCount: 0,
  typeStats: {
    size:   { asked: 0, correct: 0 },
    length: { asked: 0, correct: 0 },
    count:  { asked: 0, correct: 0 },
  },
}));

// ===== SVG MATERIALS (length visualization) =====
const SVGMaterials = (() => {
  const NS = 'http://www.w3.org/2000/svg';

  function el(tag, attrs) {
    const node = document.createElementNS(NS, tag);
    for (const [k, v] of Object.entries(attrs)) node.setAttribute(k, String(v));
    return node;
  }

  function makeSVG(vb, leftAlign) {
    const svg = el('svg', { viewBox: vb, xmlns: NS, 'aria-hidden': 'true' });
    svg.style.cssText = leftAlign
      ? 'width:96%;display:block;margin:0;overflow:visible;'
      : 'width:88%;max-height:72%;display:block;margin:auto;overflow:visible;';
    return svg;
  }

  function pencil(bodyLen, leftAlign) {
    const svg = makeSVG('0 0 240 68', leftAlign);
    const CY = 34, H = 17;
    const YT = CY - H, YB = CY + H, OH = H * 2;
    const TIP = 16, FERRULE = 10, ERASER = 16;
    const startX = leftAlign ? 8 : (240 - (TIP + bodyLen + FERRULE + ERASER)) / 2;
    let x = startX;

    svg.appendChild(el('polygon', {
      points: `${x},${CY} ${x+TIP},${YT} ${x+TIP},${YB}`, fill: '#F5CBA7'
    }));
    svg.appendChild(el('polygon', {
      points: `${x},${CY} ${x+7},${CY-4} ${x+7},${CY+4}`, fill: '#7F8C8D'
    }));
    x += TIP;

    svg.appendChild(el('rect', { x, y: YT, width: bodyLen, height: OH, fill: '#FECA57' }));
    svg.appendChild(el('rect', { x: x+4, y: YT+3, width: bodyLen-8, height: 5,
      fill: 'rgba(255,255,255,0.3)', rx: 2 }));
    x += bodyLen;

    svg.appendChild(el('rect', { x, y: YT+2, width: FERRULE, height: OH-4, fill: '#95A5A6', rx: 2 }));
    svg.appendChild(el('line', { x1: x+5, y1: YT+2, x2: x+5, y2: YB-2,
      stroke: '#7F8C8D', 'stroke-width': '1.5' }));
    x += FERRULE;

    svg.appendChild(el('rect', { x, y: YT+3, width: ERASER, height: OH-6, fill: '#FF9FF3', rx: 4 }));
    return svg;
  }

  function snake(bodyLen, leftAlign) {
    const svg = makeSVG('0 0 240 68', leftAlign);
    const CY = 34, BH = 20, HR = 15, TW = 14;
    const startX = leftAlign ? 8 : (240 - (HR*2 + bodyLen + TW)) / 2;
    const bodyX = startX + HR * 2;

    svg.appendChild(el('rect', {
      x: bodyX - 2, y: CY - BH/2, width: bodyLen + 4, height: BH, fill: '#27AE60'
    }));
    const spots = Math.max(1, Math.floor(bodyLen / 28));
    for (let i = 0; i < spots; i++) {
      const sx = bodyX + 10 + i * Math.max(1, (bodyLen - 15) / spots);
      svg.appendChild(el('ellipse', { cx: sx, cy: CY-2, rx: 7, ry: 4, fill: '#2ECC71' }));
    }

    const tx = bodyX + bodyLen;
    svg.appendChild(el('polygon', {
      points: `${tx},${CY-BH/2} ${tx},${CY+BH/2} ${tx+TW},${CY}`, fill: '#27AE60'
    }));

    svg.appendChild(el('circle', { cx: startX+HR, cy: CY, r: HR, fill: '#2ECC71' }));
    svg.appendChild(el('circle', { cx: startX+HR*0.55, cy: CY-HR*0.4, r: 3.5, fill: 'white' }));
    svg.appendChild(el('circle', { cx: startX+HR*0.55, cy: CY-HR*0.4, r: 1.8, fill: '#2d3436' }));
    svg.appendChild(el('path', {
      d: `M${startX},${CY+2} L${startX-9},${CY-4} M${startX},${CY+2} L${startX-9},${CY+8}`,
      stroke: '#E74C3C', 'stroke-width': '2.5', 'stroke-linecap': 'round', fill: 'none'
    }));
    return svg;
  }

  function train(bodyLen, leftAlign) {
    const svg = makeSVG('0 0 240 90', leftAlign);
    const TH = 30, CY = 33;
    const YT = CY - TH/2, YB = CY + TH/2;
    const FRONT = 44, REAR = 24, WR = 8;
    const COLOR = '#54A0FF';
    const startX = leftAlign ? 8 : (240 - (FRONT + bodyLen + REAR)) / 2;

    svg.appendChild(el('line', {
      x1: startX-10, y1: YB+2+WR*2+2,
      x2: startX+FRONT+bodyLen+REAR+10, y2: YB+2+WR*2+2,
      stroke: '#636e72', 'stroke-width': '3', 'stroke-linecap': 'round'
    }));

    const rX = startX + FRONT + bodyLen;
    svg.appendChild(el('rect', { x: rX, y: YT, width: REAR, height: TH, fill: COLOR, rx: 4 }));
    svg.appendChild(el('rect', { x: rX+5, y: YT+6, width: REAR-12, height: Math.round(TH*0.45),
      fill: 'rgba(255,255,255,0.75)', rx: 2 }));
    svg.appendChild(el('circle', { cx: rX+REAR-7, cy: CY+6, r: 4, fill: '#E74C3C' }));

    if (bodyLen > 0) {
      const bX = startX + FRONT;
      svg.appendChild(el('rect', { x: bX, y: YT, width: bodyLen, height: TH, fill: COLOR }));
      const sections = Math.max(1, Math.round(bodyLen / 40));
      const secW = bodyLen / sections;
      for (let s = 0; s < sections; s++) {
        const wx = bX + s * secW;
        if (s > 0) {
          svg.appendChild(el('line', { x1: wx, y1: YT, x2: wx, y2: YB,
            stroke: 'rgba(0,0,0,0.15)', 'stroke-width': '2' }));
        }
        const winX = wx + 6;
        const winW = secW - 14;
        if (winW > 8) {
          svg.appendChild(el('rect', { x: winX, y: YT+6, width: winW,
            height: Math.round(TH*0.45), fill: 'rgba(255,255,255,0.75)', rx: 2 }));
        }
      }
    }

    const fX = startX;
    svg.appendChild(el('rect', { x: fX, y: YT-5, width: FRONT, height: TH+5, fill: COLOR, rx: 6 }));
    svg.appendChild(el('rect', { x: fX+7, y: YT, width: FRONT-20, height: Math.round(TH*0.5),
      fill: 'rgba(255,255,255,0.85)', rx: 3 }));
    svg.appendChild(el('circle', { cx: fX+FRONT-9, cy: YB-8, r: 5, fill: '#FECA57' }));
    svg.appendChild(el('line', { x1: fX+FRONT, y1: YT, x2: fX+FRONT, y2: YB,
      stroke: 'rgba(0,0,0,0.18)', 'stroke-width': '2' }));

    const wheelY = YB + 2 + WR;
    const wPositions = [fX+8, fX+FRONT-8, rX+8, rX+REAR-8];
    if (bodyLen >= 35) wPositions.push(fX + FRONT + Math.round(bodyLen / 2));
    wPositions.forEach(wx => {
      svg.appendChild(el('circle', { cx: wx, cy: wheelY, r: WR, fill: '#2d3436' }));
      svg.appendChild(el('circle', { cx: wx, cy: wheelY, r: Math.round(WR*0.38), fill: '#636e72' }));
    });
    return svg;
  }

  const DRAW = { pencil, snake, train };
  const NAMES = Object.keys(DRAW);

  function draw(material, bodyLen, leftAlign) { return DRAW[material](bodyLen, leftAlign); }

  return { draw, NAMES };
})();

// ===== QUESTION GENERATOR =====
const QuestionGenerator = (() => {
  const TYPES = ['size', 'length', 'count'];

  const SIZE_EMOJIS  = ['🐘','🦁','🐸','🐥','🎈','🍎','🚌','🏠','🌳','🐠'];
  const COUNT_EMOJIS = ['🍎','🍪','🌟','🌸','⭐','🐾','🍓','🎵'];
  const LENGTH_LONG  = 120;
  const LENGTH_SHORT = 50;

  const QUESTION_MAP = {
    size_big:     { text: 'おおきいのはどっち？',  audio: 'q_size_big.wav',    tts: 'おおきいのはどっち' },
    size_small:   { text: 'ちいさいのはどっち？',  audio: 'q_size_small.wav',  tts: 'ちいさいのはどっち' },
    length_long:  { text: 'ながいのはどっち？',    audio: 'q_length_long.wav', tts: 'ながいのはどっち' },
    length_short: { text: 'みじかいのはどっち？',  audio: 'q_length_short.wav',tts: 'みじかいのはどっち' },
    count_many:   { text: 'おおいのはどっち？',    audio: 'q_count_many.wav',  tts: 'おおいのはどっち' },
    count_few:    { text: 'すくないのはどっち？',  audio: 'q_count_few.wav',   tts: 'すくないのはどっち' },
  };

  function pick(arr) { return arr[Math.floor(Math.random() * arr.length)]; }

  function makeSize(direction) {
    const emoji = pick(SIZE_EMOJIS);
    const bigItem   = { kind: 'size', emoji, fontSize: 'clamp(64px,19vmin,110px)' };
    const smallItem = { kind: 'size', emoji, fontSize: 'clamp(26px,7.5vmin,44px)' };
    const bigLeft   = Math.random() < 0.5;
    return {
      left:        bigLeft ? bigItem  : smallItem,
      right:       bigLeft ? smallItem : bigItem,
      correctSide: (direction === 'big') === bigLeft ? 'left' : 'right',
    };
  }

  function makeLength(direction) {
    const material  = pick(SVGMaterials.NAMES);
    const longItem  = { kind: 'length', material, bodyLen: LENGTH_LONG };
    const shortItem = { kind: 'length', material, bodyLen: LENGTH_SHORT };
    const longLeft  = Math.random() < 0.5;
    return {
      left:        longLeft ? longItem  : shortItem,
      right:       longLeft ? shortItem : longItem,
      correctSide: (direction === 'long') === longLeft ? 'left' : 'right',
    };
  }

  function makeCount(direction) {
    const manyCount = 5 + Math.floor(Math.random() * 3);
    const fewCount  = 2 + Math.floor(Math.random() * 2);
    const emoji     = pick(COUNT_EMOJIS);
    const manyItem  = { kind: 'count', emoji, count: manyCount };
    const fewItem   = { kind: 'count', emoji, count: fewCount };
    const manyLeft  = Math.random() < 0.5;
    return {
      left:        manyLeft ? manyItem  : fewItem,
      right:       manyLeft ? fewItem   : manyItem,
      correctSide: (direction === 'many') === manyLeft ? 'left' : 'right',
    };
  }

  function generate(prevType) {
    const candidates = prevType ? TYPES.filter(t => t !== prevType) : TYPES;
    const type = pick(candidates);

    const directions = type === 'size'   ? ['big',  'small'] :
                       type === 'length' ? ['long', 'short'] :
                                           ['many', 'few'];
    const direction = pick(directions);
    const qKey  = `${type}_${direction}`;
    const qInfo = QUESTION_MAP[qKey];

    const items = type === 'size'   ? makeSize(direction) :
                  type === 'length' ? makeLength(direction) :
                                      makeCount(direction);
    return {
      type, direction,
      text:        qInfo.text,
      audio:       qInfo.audio,
      tts:         qInfo.tts,
      left:        items.left,
      right:       items.right,
      correctSide: items.correctSide,
    };
  }

  return { generate };
})();

// ===== GAME LOGIC =====
let state   = null;
let session = {};

function buildCardContent(item) {
  if (item.kind === 'size') {
    const span = document.createElement('span');
    span.className = 'card-emoji';
    span.textContent = item.emoji;
    span.style.fontSize = item.fontSize;
    return span;
  }

  if (item.kind === 'length') {
    return SVGMaterials.draw(item.material, item.bodyLen, true);
  }

  const n = item.count;
  const cols = n <= 3 ? n : n <= 6 ? Math.ceil(n / 2) : Math.ceil(n / 3);
  const grid = document.createElement('div');
  grid.style.cssText = `display:grid;grid-template-columns:repeat(${cols},1fr);gap:clamp(2px,1.5vmin,8px);place-items:center;`;
  const fontSize = n <= 3 ? 'clamp(34px,9vmin,54px)' :
                   n <= 6 ? 'clamp(26px,7vmin,40px)' :
                             'clamp(20px,5.5vmin,32px)';
  for (let i = 0; i < n; i++) {
    const span = document.createElement('span');
    span.textContent = item.emoji;
    span.style.cssText = `font-size:${fontSize};line-height:1;`;
    grid.appendChild(span);
  }
  return grid;
}

function startGame() {
  session = {
    questionIndex: 0,
    wrongCount:    0,
    prevType:      null,
    locked:        false,
    currentQ:      null,
    hintShown:     false,
  };
  UICommon.showScreen('game');
  nextQuestion();
}

function nextQuestion() {
  session.locked     = false;
  session.wrongCount = 0;
  session.hintShown  = false;

  const q = QuestionGenerator.generate(session.prevType);
  session.currentQ = q;
  session.prevType = q.type;

  state.typeStats[q.type].asked++;
  GameState.save(state);

  document.getElementById('question-text').textContent = q.text;
  UICommon.renderProgress(session.questionIndex, QUESTIONS_PER_SET);

  document.getElementById('compare-area').classList.toggle('length-layout', q.type === 'length');

  const cardLeft  = document.getElementById('card-left');
  const cardRight = document.getElementById('card-right');
  [cardLeft, cardRight].forEach(c => {
    c.innerHTML = '';
    c.classList.remove('correct', 'wrong', 'hint-pulse', 'disabled');
  });
  cardLeft.appendChild(buildCardContent(q.left));
  cardRight.appendChild(buildCardContent(q.right));

  Speech.speak(q.tts, q.audio);
}

function onCardTap(side) {
  if (session.locked) return;
  const q = session.currentQ;
  if (side === q.correctSide) onCorrect(side);
  else                        onWrong(side);
}

function onCorrect(side) {
  session.locked = true;
  const card = document.getElementById(side === 'left' ? 'card-left' : 'card-right');
  card.classList.add('correct');
  document.getElementById(side === 'left' ? 'card-right' : 'card-left').classList.add('disabled');

  AudioEngine.playCorrect();
  UICommon.spawnStars(card);
  UICommon.jumpCharacter();

  if (session.wrongCount === 0) {
    state.typeStats[session.currentQ.type].correct++;
  }
  state.totalCorrect++;
  GameState.save(state);

  const praiseIdx = Math.floor(Math.random() * 3) + 1;
  const praises   = ['できたね！', 'すごい！', 'やったね！'];
  Speech.speak(praises[praiseIdx - 1], `praise_${praiseIdx}.wav`);

  session.questionIndex++;
  UICommon.renderProgress(session.questionIndex, QUESTIONS_PER_SET);

  if (session.questionIndex >= QUESTIONS_PER_SET) {
    state.setClearCount++;
    GameState.save(state);
    setTimeout(showClear, NEXT_DELAY);
  } else {
    setTimeout(nextQuestion, NEXT_DELAY);
  }
}

function onWrong(side) {
  const card = document.getElementById(side === 'left' ? 'card-left' : 'card-right');
  card.classList.add('wrong');
  AudioEngine.playWrong();
  setTimeout(() => card.classList.remove('wrong'), 450);
  session.wrongCount++;
  if (session.wrongCount >= HINT_THRESHOLD && !session.hintShown) showHint();
}

function showHint() {
  session.hintShown = true;
  const q = session.currentQ;
  const correctCard = document.getElementById(q.correctSide === 'left' ? 'card-left' : 'card-right');
  correctCard.classList.add('hint-pulse');
  Speech.speak('もういちど みてみよう', 'hint.wav');
  setTimeout(() => Speech.speak(q.tts, q.audio), 2200);
}

function showClear() {
  AudioEngine.playClear();
  Speech.speak('ぜんぶ できたね！', 'clear.wav');
  UICommon.spawnConfetti();
  UICommon.showScreen('clear');
}

function renderParentStats() {
  const el = document.getElementById('parent-stats');
  if (!el) return;
  const ts = state.typeStats;
  const totalAsked = Object.values(ts).reduce((s, v) => s + v.asked, 0);
  const totalFirst = Object.values(ts).reduce((s, v) => s + v.correct, 0);
  const accuracy   = totalAsked > 0 ? Math.round(totalFirst / totalAsked * 100) : 0;

  const typeLabels = { size: 'おおきさ', length: 'ながさ', count: 'かずかず' };
  let typeCells = '';
  for (const [key, label] of Object.entries(typeLabels)) {
    const stat = ts[key];
    const pct  = stat.asked > 0 ? Math.round(stat.correct / stat.asked * 100) + '%' : '-';
    typeCells += `<div class="type-stat-cell">
      <span class="type-label">${label}</span>
      <span class="type-pct">${pct}</span>
    </div>`;
  }

  el.innerHTML = `
    <div class="stat-row"><span>せいかい（のべ）</span><strong>${state.totalCorrect}もん</strong></div>
    <div class="stat-row"><span>クリア</span><strong>${state.setClearCount}かい</strong></div>
    <div class="stat-row"><span>1かいめせいかいりつ</span><strong>${accuracy}%</strong></div>
    <div class="type-stats-label">かもくべつ せいかいりつ（1かいめ）</div>
    <div class="type-stats-grid">${typeCells}</div>`;
}

// カードタップ
document.getElementById('card-left').addEventListener('click',  () => onCardTap('left'));
document.getElementById('card-right').addEventListener('click', () => onCardTap('right'));

// ===== BOOT =====
state = GameState.load();
AudioPlayer.preload(PRELOAD_FILES);
UICommon.init({
  onStart:     () => { startGame(); },
  onSpeakGame: () => { if (session.currentQ) Speech.speak(session.currentQ.tts, session.currentQ.audio); },
  onNextClear: () => { startGame(); },
  onReset:     () => { state = GameState.reset(); },
  renderStats: () => { renderParentStats(); },
});
</script>
