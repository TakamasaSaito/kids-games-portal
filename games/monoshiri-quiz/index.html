<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="ものしりクイズ">
<link rel="apple-touch-icon" href="icons/icon-180.png">
<link rel="icon" href="icons/icon-512.png">
<title>ものしりクイズ</title>
<link rel="stylesheet" href="../../shared/game-shell.css?v=2">
<style>:root { --game-accent: #26DE81; }</style>
<style>
/* ===== カラーテーマ ===== */
:root {
  --bg-start: #4776E6;
  --bg-end:   #8E54E9;
  --accent:   #FECA57;
}

/* ===== SELECT SCREEN ===== */
#screen-select {
  gap: 2vmin;
  justify-content: flex-start;
  padding-top: max(60px, calc(env(safe-area-inset-top) + 56px));
  padding-bottom: max(16px, env(safe-area-inset-bottom));
  overflow-y: auto;
  -webkit-overflow-scrolling: touch;
}

.screen-title {
  font-size: clamp(13px, 3.2vmin, 19px);
  font-weight: 700;
  color: rgba(255,255,255,0.85);
  text-align: center;
  width: 100%;
}

.category-grid {
  display: grid;
  grid-template-columns: repeat(2, 1fr);
  gap: 8px;
  width: 100%;
  max-width: 400px;
}

.category-btn {
  touch-action: manipulation;
  padding: 0.65em 0.4em;
  font-size: clamp(12px, 3vmin, 17px);
  font-weight: 700;
  background: rgba(255,255,255,0.15);
  color: var(--white);
  border: 2px solid rgba(255,255,255,0.3);
  border-radius: 12px;
  cursor: pointer;
  -webkit-tap-highlight-color: transparent;
  transition: background 0.12s, border-color 0.12s, color 0.12s;
  line-height: 1.3;
}
.category-btn.omakase {
  grid-column: 1 / -1;
  background: rgba(254,202,87,0.18);
  border-color: rgba(254,202,87,0.6);
}
.category-btn.selected {
  background: rgba(255,255,255,0.9);
  color: var(--text-dark);
  border-color: var(--white);
}
.category-btn.omakase.selected {
  background: var(--accent);
  border-color: var(--accent);
}
.category-btn:active { transform: scale(0.96); }

.age-row {
  display: flex;
  gap: 10px;
  width: 100%;
  max-width: 400px;
}

.age-btn {
  flex: 1;
  touch-action: manipulation;
  padding: 0.65em 0.4em;
  font-size: clamp(12px, 3vmin, 17px);
  font-weight: 700;
  background: rgba(255,255,255,0.15);
  color: var(--white);
  border: 2px solid rgba(255,255,255,0.3);
  border-radius: 12px;
  cursor: pointer;
  -webkit-tap-highlight-color: transparent;
  transition: background 0.12s, border-color 0.12s, color 0.12s;
  line-height: 1.3;
}
.age-btn.selected {
  background: rgba(255,255,255,0.9);
  color: var(--text-dark);
  border-color: var(--white);
}
.age-btn:active { transform: scale(0.96); }

/* ===== GAME SCREEN ===== */
#screen-game {
  justify-content: space-between;
  padding-top: max(54px, calc(env(safe-area-inset-top) + 48px));
  padding-bottom: max(12px, env(safe-area-inset-bottom));
  gap: 1.5vmin;
}

.quiz-question {
  width: 100%;
  max-width: 440px;
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 8px;
}

.speak-row {
  display: flex;
  align-items: center;
  gap: 12px;
  justify-content: center;
}

.quiz-prompt {
  font-size: clamp(17px, 5vmin, 30px);
  font-weight: 700;
  color: var(--white);
  text-align: center;
  line-height: 1.55;
  padding: 12px 16px;
  background: rgba(255,255,255,0.15);
  border-radius: 16px;
  width: 100%;
  word-break: break-all;
}

.choices {
  width: 100%;
  max-width: 440px;
  display: flex;
  flex-direction: column;
  gap: 8px;
}

.choice-card {
  touch-action: manipulation;
  display: flex;
  align-items: center;
  gap: 10px;
  padding: 12px 14px;
  background: rgba(255,255,255,0.92);
  border: 3px solid transparent;
  border-radius: 14px;
  cursor: pointer;
  -webkit-tap-highlight-color: transparent;
  transition: transform 0.1s, background 0.15s, border-color 0.15s, opacity 0.15s;
  min-height: 56px;
  box-shadow: 0 2px 8px rgba(0,0,0,0.15);
}
.choice-card:not(.locked):active { transform: scale(0.97); }
.choice-card.locked { cursor: default; }
.choice-card.correct {
  background: #d4edda;
  border-color: #28a745;
}
.choice-card.wrong {
  background: #f8d7da;
  border-color: #dc3545;
  opacity: 0.5;
}

.choice-num {
  flex-shrink: 0;
  width: 26px;
  height: 26px;
  border-radius: 50%;
  background: var(--bg-start);
  color: var(--white);
  font-size: 14px;
  font-weight: 900;
  display: flex;
  align-items: center;
  justify-content: center;
  line-height: 1;
}

.choice-speak {
  flex-shrink: 0;
  touch-action: manipulation;
  width: 34px;
  height: 34px;
  border: none;
  background: rgba(0,0,0,0.07);
  border-radius: 50%;
  font-size: 15px;
  cursor: pointer;
  display: flex;
  align-items: center;
  justify-content: center;
  -webkit-tap-highlight-color: transparent;
}
.choice-speak:active { background: rgba(0,0,0,0.14); }

.choice-label {
  font-size: clamp(15px, 4.2vmin, 24px);
  font-weight: 700;
  color: var(--text-dark);
  line-height: 1.3;
  flex: 1;
}

.feedback-area {
  width: 100%;
  max-width: 440px;
  min-height: 36px;
  display: flex;
  flex-direction: column;
  gap: 6px;
}

.retry-msg {
  font-size: clamp(14px, 3.5vmin, 20px);
  font-weight: 700;
  color: #ffe082;
  text-align: center;
  padding: 6px 0;
}

.explanation-box {
  font-size: clamp(13px, 3.3vmin, 19px);
  color: var(--white);
  text-align: center;
  padding: 10px 14px;
  background: rgba(255,255,255,0.18);
  border-radius: 12px;
  line-height: 1.5;
}

.action-row {
  width: 100%;
  max-width: 440px;
  display: flex;
  gap: 10px;
  align-items: center;
  justify-content: center;
}

.skip-btn {
  touch-action: manipulation;
  padding: 0.55em 1.6em;
  font-size: clamp(13px, 3.3vmin, 19px);
  font-weight: 700;
  background: rgba(255,255,255,0.15);
  color: rgba(255,255,255,0.85);
  border: 1.5px solid rgba(255,255,255,0.35);
  border-radius: 50px;
  cursor: pointer;
  -webkit-tap-highlight-color: transparent;
}
.skip-btn:active { transform: scale(0.95); }

.btn-primary:disabled {
  opacity: 0.5;
  cursor: not-allowed;
  transform: none;
}

.load-error {
  font-size: clamp(13px, 3.3vmin, 18px);
  color: rgba(255,255,255,0.95);
  text-align: center;
  padding: 8px 16px;
  background: rgba(220,53,69,0.35);
  border-radius: 10px;
  max-width: 320px;
}

<!-- shared/ 読み込み順は decisions/001-shared-design.md のとおり -->
<script src="../../shared/audio-engine.js?v=2"></script>
<script src="../../shared/audio-player.js?v=2"></script>
<script src="../../shared/speech.js?v=2"></script>
<script src="../../shared/game-state.js?v=2"></script>
<script src="../../shared/ui-common.js?v=2"></script>
<script>
'use strict';

// ===== 定数 =====
const ROUND_SIZE  = 10;  // JSON の defaults.roundSize(5) をコード側で上書き(おまかせ目標値)
const STORAGE_KEY = 'monoshiri-quiz-v1';
const DATA_VERSION = 1;  // localStorage データ形式のバージョン
const CORRECT_ADVANCE_DELAY = 1500;  // 正解後、自動で次問題へ進むまでの待機時間(ms)
const SKIP_LEAD_S = 0.6;  // 2本目以降の wav 先頭無音スキップ量(秒)
const GAP_MS      = 150;  // 連続再生のつなぎ目の間(ms)
const SPEECH_KEY  = 'monoshiri-speech-enabled';  // 音声オン/オフ保存キー

// ===== 音声オン/オフ =====
let speechEnabled = true;

function loadSpeechEnabled() {
  try {
    const v = localStorage.getItem(SPEECH_KEY);
    return v === null ? true : v === 'true';
  } catch (e) { return true; }
}

function saveSpeechEnabled(v) {
  try { localStorage.setItem(SPEECH_KEY, String(v)); } catch (e) {}
}

function updateSpeechUI() {
  const btn = document.getElementById('toggle-speech');
  const lbl = document.getElementById('speech-label');
  if (btn) btn.classList.toggle('on', speechEnabled);
  if (lbl) lbl.textContent = speechEnabled ? 'オン' : 'オフ';
}

// ===== 連続音声再生 =====
// AudioPlayer は1ファイル単位のみのため、問題文→番号→選択肢→えらんでね の
// 連続再生は独自プールで管理する (R4: AudioPlayer は再定義しない)
const QuizAudio = (() => {
  const AUDIO_BASE = 'audio/';
  const pool = new Map();
  let chainId = 0;
  let _version = '';

  function setVersion(v) { _version = v || ''; }

  function _url(f) {
    return AUDIO_BASE + f + (_version ? '?v=' + _version : '');
  }

  function preload(files) {
    files.forEach(f => {
      if (!f || pool.has(f)) return;
      const a = new Audio(_url(f));
      a.preload = 'auto';
      pool.set(f, a);
    });
  }

  // items: [{file, tts}]  file がない場合は tts のみで再生
  // 1本目の wav はそのまま再生、2本目以降は先頭無音を SKIP_LEAD_S 秒スキップ
  function playSequence(items, gapMs) {
    if (!speechEnabled) return;
    gapMs = (gapMs !== undefined) ? gapMs : GAP_MS;
    const id = ++chainId;
    let i = 0;
    let isFirst = true;

    function next() {
      if (id !== chainId || i >= items.length) return;
      const item = items[i++];
      const first = isFirst;
      isFirst = false;
      const a = item.file ? pool.get(item.file) : null;

      if (!a) {
        _ttsFallback(item.tts, () => { if (id === chainId) setTimeout(next, gapMs); });
        return;
      }

      a.currentTime = first ? 0 : SKIP_LEAD_S;

      function cleanup() {
        a.removeEventListener('ended', onEnded);
        a.removeEventListener('error', onErr);
      }
      function onEnded() {
        cleanup();
        if (id !== chainId) return;
        setTimeout(next, gapMs);
      }
      function onErr() {
        cleanup();
        if (id !== chainId) return;
        _ttsFallback(item.tts, () => { if (id === chainId) setTimeout(next, gapMs); });
      }

      a.addEventListener('ended', onEnded);
      a.addEventListener('error', onErr);

      const p = a.play();
      if (p) {
        p.catch(err => {
          cleanup();
          if (!err || err.name === 'AbortError') return;
          if (id !== chainId) return;
          _ttsFallback(item.tts, () => { if (id === chainId) setTimeout(next, gapMs); });
        });
      }
    }

    next();
  }

  function _ttsFallback(text, cb) {
    if (!text || !('speechSynthesis' in window)) { cb && cb(); return; }
    try {
      speechSynthesis.cancel();
      const u = new SpeechSynthesisUtterance(text);
      u.lang = 'ja-JP';
      u.rate = 0.9;
      const safety = setTimeout(() => { cb && cb(); cb = null; },
                                Math.max(2000, text.length * 180 + 1500));
      u.onend = () => { clearTimeout(safety); cb && cb(); cb = null; };
      speechSynthesis.speak(u);
    } catch (e) { cb && cb(); }
  }

  function stop() {
    chainId++;
    pool.forEach(a => { if (!a.paused) { a.pause(); a.currentTime = 0; } });
    try { if ('speechSynthesis' in window) speechSynthesis.cancel(); } catch (e) {}
  }

  return { setVersion, preload, playSequence, stop };
})();

// ===== ゲーム状態 =====
const GameState = createGameState(STORAGE_KEY, () => ({
  dataVersion:     DATA_VERSION,
  totalCorrect:    0,
  recentIds:       [],
  questionHistory: {},  // { [qId]: { played, firstCorrect, skipped, lastPlayedAt } }
}));
let state = null;

let quizData      = null;
let ageMap        = {};
let choiceFileMap = {};  // spokenLabel → ファイル名(拡張子なし)
let loadError     = false;
let selectedCatId = 'all';
let selectedAge   = 3;

// ===== ユーティリティ =====
function buildSpeechText(q) {
  const parts = q.shuffledChoices.map((c, i) => `${i + 1}、${c.spokenLabel}`).join('。');
  return `${q.spokenPrompt}。${parts}。えらんでね`;
}

// 問題の連続再生アイテム列を構築する
function buildAudioItems(q) {
  const NUMS = [
    { file: 'num_ichi.wav', tts: 'いち' },
    { file: 'num_ni.wav',   tts: 'に' },
    { file: 'num_san.wav',  tts: 'さん' },
  ];
  const items = [{ file: 'q_' + q.id.toLowerCase() + '.wav', tts: q.spokenPrompt }];
  q.shuffledChoices.forEach((c, i) => {
    items.push(NUMS[i]);
    const fname = choiceFileMap[c.spokenLabel];
    items.push({ file: fname ? fname + '.wav' : null, tts: c.spokenLabel });
  });
  items.push({ file: 'end_erandene.wav', tts: 'えらんでね' });
  return items;
}

// 問題の音声ファイルをプリロードする
function preloadQuestionAudio(q) {
  if (!q) return;
  const files = ['q_' + q.id.toLowerCase() + '.wav'];
  (q.shuffledChoices || q.choices).forEach(c => {
    const f = choiceFileMap[c.spokenLabel];
    if (f) files.push(f + '.wav');
  });
  QuizAudio.preload(files);
}

function shuffle(arr) {
  arr = arr.slice();
  for (let i = arr.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [arr[i], arr[j]] = [arr[j], arr[i]];
  }
  return arr;
}

// ===== ジャンル絵文字 =====
const CATEGORY_EMOJI = {
  animals:         '🐶',
  small_creatures: '🐛',
  nature:          '🍂',
  food:            '🍎',
  daily:           '✏️',
  home:            '🏠',
  transport:       '🚗',
  places:          '🏪',
  body:            '💪',
  play:            '🎨',
};

// ===== 選択画面の構築 =====
function buildSelectScreen() {
  if (!quizData) return;

  const grid = document.getElementById('category-grid');
  grid.innerHTML = '';

  const omakase = document.createElement('button');
  omakase.className = 'category-btn omakase' + (selectedCatId === 'all' ? ' selected' : '');
  omakase.dataset.catId = 'all';
  omakase.textContent = '🎲 おまかせ';
  omakase.addEventListener('click', () => selectCategory('all'));
  grid.appendChild(omakase);

  quizData.categories.forEach(cat => {
    const btn = document.createElement('button');
    btn.className = 'category-btn' + (selectedCatId === cat.id ? ' selected' : '');
    btn.dataset.catId = cat.id;
    const emoji = CATEGORY_EMOJI[cat.id] || '';
    btn.textContent = emoji ? emoji + ' ' + cat.label : cat.label;
    btn.addEventListener('click', () => selectCategory(cat.id));
    grid.appendChild(btn);
  });

  document.querySelectorAll('.age-btn').forEach(btn => {
    btn.classList.toggle('selected', Number(btn.dataset.age) === selectedAge);
  });
}

function selectCategory(catId) {
  selectedCatId = catId;
  document.querySelectorAll('.category-btn').forEach(btn => {
    btn.classList.toggle('selected', btn.dataset.catId === catId);
  });
}

// ===== 出題優先度 =====
// 0: まだ出ていない  1: 出たが初回正解なし  2: 初回正解あり
function getPriority(q, history) {
  const rec = (history || {})[q.id];
  if (!rec || rec.played === 0) return 0;
  if (rec.firstCorrect === 0) return 1;
  return 2;
}

// ===== ラウンド構築 =====
// おまかせ: 1ジャンル最大2問・5ジャンル以上(10問÷2=5ジャンル必須)
// 単一ジャンル指定: ジャンル制限なし
// 最近20問のIDを優先的に回避し、候補不足時は fallback から補充
// 優先順: まだ出ていない → 初回不正解/スキップ → 既に正解
function buildRound(questions, catId, recentIds, history) {
  const pool = questions.filter(q =>
    q.enabled &&
    (catId === 'all' || q.categoryId === catId) &&
    ageMap[q.id] === selectedAge
  );

  // シャッフル後に優先度順でソート（同優先度内はランダム）
  function sortByPriority(arr) {
    const shuffled = shuffle(arr);
    return shuffled.sort((a, b) => getPriority(a, history) - getPriority(b, history));
  }

  const preferred = sortByPriority(pool.filter(q => !recentIds.includes(q.id)));
  const fallback  = sortByPriority(pool.filter(q =>  recentIds.includes(q.id)));

  const selected    = [];
  const usedIds     = new Set();
  const usedConcept = new Set();
  const genreCnt    = {};

  function tryAdd(q, relaxGenre) {
    if (usedIds.has(q.id)) return false;
    if (usedConcept.has(q.conceptKey)) return false;
    if (catId === 'all' && !relaxGenre) {
      if ((genreCnt[q.categoryId] || 0) >= 2) return false;
    }
    usedIds.add(q.id);
    usedConcept.add(q.conceptKey);
    genreCnt[q.categoryId] = (genreCnt[q.categoryId] || 0) + 1;
    selected.push(q);
    return true;
  }

  for (const q of preferred) {
    if (selected.length >= ROUND_SIZE) break;
    tryAdd(q, false);
  }
  for (const q of fallback) {
    if (selected.length >= ROUND_SIZE) break;
    tryAdd(q, false);
  }
  // おまかせで不足の場合、ジャンル制限を緩和して補充
  if (catId === 'all' && selected.length < ROUND_SIZE) {
    for (const q of [...preferred, ...fallback]) {
      if (selected.length >= ROUND_SIZE) break;
      tryAdd(q, true);
    }
  }

  // 選択肢のシャッフルはラウンド開始時1回のみ
  return selected.map(q => ({
    ...q,
    shuffledChoices: shuffle(q.choices),
  }));
}

// ===== ゲーム開始 =====
let currentRound = [];
let currentIndex = 0;
let correctTimer = null;  // 正解後の自動進行タイマー

function startGame() {
  if (!quizData) return;

  currentRound = buildRound(
    quizData.questions,
    selectedCatId,
    state.recentIds || [],
    state.questionHistory || {}
  );
  currentIndex = 0;

  UICommon.showScreen('game');
  UICommon.renderProgress(0, currentRound.length);
  renderQuestion();
}

// ===== 問題描画 =====
let answerLocked = false;

function renderQuestion() {
  QuizAudio.stop();  // 前の問題の音声を止める
  if (correctTimer) { clearTimeout(correctTimer); correctTimer = null; }

  const q = currentRound[currentIndex];
  answerLocked = false;
  q._firstAnswerCorrect = null;  // null=未回答 true=初回正解 false=初回不正解

  document.getElementById('quiz-prompt').textContent = q.prompt;
  document.getElementById('retry-msg').hidden    = true;
  document.getElementById('skip-btn').hidden     = false;

  const choicesEl = document.getElementById('choices');
  choicesEl.innerHTML = '';

  q.shuffledChoices.forEach((choice, idx) => {
    const card = document.createElement('div');
    card.className = 'choice-card';
    card.setAttribute('role', 'button');
    card.setAttribute('tabindex', '0');
    card.dataset.choiceId = choice.id;

    const numEl = document.createElement('span');
    numEl.className = 'choice-num';
    numEl.textContent = String(idx + 1);

    const speakBtn = document.createElement('button');
    speakBtn.className = 'choice-speak';
    speakBtn.setAttribute('aria-label', choice.spokenLabel + ' をきく');
    speakBtn.textContent = '🔊';
    speakBtn.addEventListener('click', e => {
      e.stopPropagation();
      if (!speechEnabled) return;
      QuizAudio.stop();
      const fname = choiceFileMap[choice.spokenLabel];
      QuizAudio.playSequence([{ file: fname ? fname + '.wav' : null, tts: choice.spokenLabel }]);
    });

    const labelEl = document.createElement('span');
    labelEl.className = 'choice-label';
    labelEl.textContent = choice.label;

    card.appendChild(numEl);
    card.appendChild(speakBtn);
    card.appendChild(labelEl);
    card.addEventListener('click', () => handleAnswer(q, choice));
    card.addEventListener('keydown', e => {
      if (e.key === 'Enter' || e.key === ' ') {
        e.preventDefault();
        handleAnswer(q, choice);
      }
    });
    choicesEl.appendChild(card);
  });

  UICommon.renderProgress(currentIndex, currentRound.length);

  // 現問題の音声をプリロードし、次問題の音声も先読みしておく
  preloadQuestionAudio(q);
  preloadQuestionAudio(currentRound[currentIndex + 1]);

  // 問題文 → いち+選択肢1 → に+選択肢2 → さん+選択肢3 → えらんでね の順に再生
  if (speechEnabled) QuizAudio.playSequence(buildAudioItems(q));
}

// ===== 回答処理 =====
function handleAnswer(q, choice) {
  if (answerLocked) return;

  QuizAudio.stop();  // 回答時に再生中の音声を止める

  const isCorrect = choice.id === q.correctChoiceId;
  const cards = document.querySelectorAll('#choices .choice-card');

  if (isCorrect) {
    if (q._firstAnswerCorrect === null) q._firstAnswerCorrect = true;
    answerLocked = true;
    cards.forEach(card => {
      card.classList.add('locked');
      if (card.dataset.choiceId === choice.id) card.classList.add('correct');
    });

    document.getElementById('retry-msg').hidden  = true;
    document.getElementById('skip-btn').hidden   = true;

    AudioEngine.playCorrect();
    UICommon.jumpCharacter();
    UICommon.spawnStars(document.querySelector('#choices .choice-card.correct'));
    correctTimer = setTimeout(() => { correctTimer = null; advanceQuestion(false); }, CORRECT_ADVANCE_DELAY);
  } else {
    // 初回回答が不正解
    if (q._firstAnswerCorrect === null) q._firstAnswerCorrect = false;
    // 外したカードを無効化し、残りは選び直せる
    cards.forEach(card => {
      if (card.dataset.choiceId === choice.id) {
        card.classList.add('wrong', 'locked');
      }
    });
    document.getElementById('retry-msg').hidden = false;
    AudioEngine.playWrong();
    if (speechEnabled) Speech.speak('もういちど えらんでみよう');
  }
}

// ===== 問題履歴の記録 =====
function recordHistory(q, skipped) {
  if (!state.questionHistory) state.questionHistory = {};
  const prev = state.questionHistory[q.id] ||
    { played: 0, firstCorrect: 0, skipped: 0, lastPlayedAt: null };
  state.questionHistory[q.id] = {
    played:       prev.played + 1,
    firstCorrect: prev.firstCorrect + ((!skipped && q._firstAnswerCorrect === true) ? 1 : 0),
    skipped:      prev.skipped + (skipped ? 1 : 0),
    lastPlayedAt: new Date().toISOString(),
  };
  GameState.save(state);
}

// ===== 次の問題へ進む =====
// skipped: スキップボタンで進む場合 true
function advanceQuestion(skipped = false) {
  const q = currentRound[currentIndex];
  recordHistory(q, skipped);

  currentIndex++;
  UICommon.renderProgress(currentIndex, currentRound.length);

  if (currentIndex >= currentRound.length) {
    // recentIds を更新して保存
    const roundIds = currentRound.map(r => r.id);
    state.recentIds = [...(state.recentIds || []), ...roundIds].slice(-20);
    GameState.save(state);

    setTimeout(() => {
      AudioEngine.playClear();
      document.getElementById('clear-subtitle').textContent =
        currentRound.length + 'もん あそんだね！';
      UICommon.spawnConfetti();
      UICommon.showScreen('clear');
    }, 800);
  } else {
    renderQuestion();
  }
}

// ===== JSON 読み込み =====
Promise.all([
  fetch('data/quiz_questions_300.json').then(r => r.json()),
  fetch('data/monoshiri_age_map.json').then(r => r.json()),
  fetch('audio/choice_filename_map.json').then(r => r.json()).catch(() => ({})),
]).then(([quizJson, ageJson, mapJson]) => {
  quizData      = quizJson;
  ageMap        = ageJson.ageByQuestionId || {};
  choiceFileMap = mapJson || {};
  QuizAudio.setVersion(quizJson.contentVersion || '');
  // 固定ファイル(番号・案内)を起動時にプリロード
  QuizAudio.preload(['num_ichi.wav', 'num_ni.wav', 'num_san.wav', 'end_erandene.wav']);
  buildSelectScreen();
  const btn = document.getElementById('btn-start');
  btn.disabled = false;
  btn.textContent = 'はじめる';
}).catch(() => {
  loadError = true;
  document.getElementById('load-error').hidden = false;
});

// ===== BOOT =====
speechEnabled = loadSpeechEnabled();
updateSpeechUI();
state = GameState.load();
// データ形式が変わった場合は履歴だけクリアして続行
if (state.dataVersion !== DATA_VERSION) {
  state.questionHistory = {};
  state.dataVersion = DATA_VERSION;
  GameState.save(state);
}

UICommon.init({
  // R1: UICommon が btn-start タップ時に AudioEngine.resume / AudioPlayer.unlock /
  //     Speech.init を同期的に先頭で呼ぶ
  onStart: () => {
    if (!quizData || loadError) return;
    buildSelectScreen();
    UICommon.showScreen('select');
  },
  onSpeakGame: () => {
    if (!speechEnabled) return;
    const q = currentRound[currentIndex];
    if (!q) return;
    QuizAudio.stop();
    QuizAudio.playSequence(buildAudioItems(q));
  },
  onNextClear: () => {
    buildSelectScreen();
    UICommon.showScreen('select');
  },
  onReset: () => {
    state = GameState.reset();
  },
  extraScreens: { select: document.getElementById('screen-select') },
});

// ===== SELECT SCREEN イベント =====

document.getElementById('btn-home-select').addEventListener('click', () => {
  AudioEngine.playClick();
  Speech.cancel();
  if (window.parent !== window) {
    window.parent.postMessage({ type: 'go-home' }, '*');
  } else {
    UICommon.showScreen('start');
  }
});

document.getElementById('btn-back-start').addEventListener('click', () => {
  AudioEngine.playClick();
  UICommon.showScreen('start');
});

document.querySelectorAll('.age-btn').forEach(btn => {
  btn.addEventListener('click', () => {
    selectedAge = Number(btn.dataset.age);
    document.querySelectorAll('.age-btn').forEach(b =>
      b.classList.toggle('selected', b === btn)
    );
    AudioEngine.playClick();
  });
});

document.getElementById('btn-start-game').addEventListener('click', () => {
  AudioEngine.playClick();
  startGame();
});

// ===== SPEECH TOGGLE =====

document.getElementById('toggle-speech').addEventListener('click', () => {
  speechEnabled = !speechEnabled;
  saveSpeechEnabled(speechEnabled);
  if (!speechEnabled) QuizAudio.stop();
  updateSpeechUI();
});

// ===== HISTORY MODAL イベント =====

document.getElementById('btn-history-confirm').addEventListener('click', () => {
  document.getElementById('modal-parent').classList.remove('active');
  document.getElementById('modal-history').classList.add('active');
});

document.getElementById('btn-history-do').addEventListener('click', () => {
  state.questionHistory = {};
  state.recentIds = [];
  GameState.save(state);
  document.getElementById('modal-history').classList.remove('active');
});

document.getElementById('btn-history-cancel').addEventListener('click', () => {
  document.getElementById('modal-history').classList.remove('active');
  document.getElementById('modal-parent').classList.add('active');
});

// ===== GAME SCREEN イベント =====

document.getElementById('skip-btn').addEventListener('click', () => {
  if (answerLocked) return;
  QuizAudio.stop();
  AudioEngine.playClick();
  advanceQuestion(true);   // スキップ
});

// 🏠 押下時にタイマー・音声をキャンセル（ui-common.js のリスナーと共存）
document.getElementById('btn-home-game').addEventListener('click', () => {
  QuizAudio.stop();
  if (correctTimer) { clearTimeout(correctTimer); correctTimer = null; }
});

// リセット実行時にタイマー・音声をキャンセル（ui-common.js のリスナーと共存）
document.getElementById('btn-reset-do').addEventListener('click', () => {
  QuizAudio.stop();
  if (correctTimer) { clearTimeout(correctTimer); correctTimer = null; }
});

// おわるボタン（ui-common.js の Speech.cancel() と共存）
document.getElementById('btn-quit').addEventListener('click', () => {
  QuizAudio.stop();
});
</script>
</body>
</html>
