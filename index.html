<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="こどもゲーム">
<link rel="apple-touch-icon" href="icons/icon-180.png">
<link rel="icon" href="icons/icon-512.png">
<title>こどもゲーム</title>
<style>
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

/* 案D: A+B+C ミックス */
:root {
  --bg-start:    #667eea;
  --bg-end:      #764ba2;
  --accent:      #FECA57;
  --game-accent: var(--accent);
  --white:       #fff;
  --text-dark:   #2d3436;
}

html, body {
  height: 100%;
  overflow: hidden;
  font-family: -apple-system, 'Hiragino Kaku Gothic ProN', 'Hiragino Sans', sans-serif;
  user-select: none;
  -webkit-touch-callout: none;
  -webkit-user-select: none;
}

body {
  background: linear-gradient(135deg, var(--bg-start) 0%, var(--bg-end) 100%);
  display: flex;
  align-items: center;
  justify-content: center;
  min-height: 100vh;
  min-height: -webkit-fill-available;
}

/* 案A: CSS 星かざり */
body::before {
  content: '';
  position: fixed;
  inset: 0;
  pointer-events: none;
  background-image:
    radial-gradient(circle, rgba(255,255,255,0.35) 1px, transparent 1px),
    radial-gradient(circle, rgba(255,255,255,0.20) 1.5px, transparent 1.5px),
    radial-gradient(circle, rgba(255,255,255,0.12) 2px, transparent 2px);
  background-size: 46px 46px, 73px 73px, 109px 109px;
  background-position: 0 0, 23px 37px, 55px 18px;
  z-index: 0;
}

/* ===== SCREENS ===== */
.screen {
  display: none;
  width: 100%;
  height: 100%;
  min-height: 100vh;
  min-height: -webkit-fill-available;
  position: absolute;
  inset: 0;
  z-index: 1; /* 星より前面 */
}
.screen.active { display: flex; }

/* ===== PORTAL SCREEN ===== */
#screen-portal {
  flex-direction: column;
  align-items: center;
  overflow-y: auto;
  -webkit-overflow-scrolling: touch;
  padding: env(safe-area-inset-top, 16px) env(safe-area-inset-right, 16px)
           env(safe-area-inset-bottom, 16px) env(safe-area-inset-left, 16px);
}

.portal-header {
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 2vmin;
  padding: 5vmin 0 4vmin;
  flex-shrink: 0;
}

.portal-mascot {
  font-size: clamp(56px, 16vmin, 96px);
  animation: float 3s ease-in-out infinite;
  display: block;
  filter: drop-shadow(0 6px 10px rgba(60,30,120,0.28)); /* 案A */
}

@keyframes float {
  0%, 100% { transform: translateY(0); }
  50%       { transform: translateY(-10px); }
}

.portal-title {
  font-size: clamp(28px, 8vmin, 56px);
  font-weight: 900;
  color: var(--white);
  text-shadow: 0 4px 16px rgba(0,0,0,0.3);
  text-align: center;
}

.portal-subtitle {
  font-size: clamp(14px, 3.5vmin, 22px);
  color: rgba(255,255,255,0.85);
  text-align: center;
}

/* ===== GAME GRID ===== */
.game-grid {
  display: grid;
  grid-template-columns: repeat(2, 1fr);
  gap: clamp(10px, 2.5vmin, 18px);
  width: 100%;
  max-width: min(640px, 96vw);
  padding-bottom: 5vmin;
}

@media (min-width: 600px) {
  .game-grid { grid-template-columns: repeat(3, 1fr); }
}

/* 案D ===== GAME CARD (3D 底面影 + 4px 沈む) ===== */
.game-card {
  touch-action: manipulation;
  background: var(--white);
  border: none;
  border-radius: 20px;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  gap: 0.35em;
  padding: clamp(14px, 3.5vmin, 22px) 8px;
  min-height: 88px;
  cursor: pointer;
  box-shadow: 0 4px 0 rgba(0,0,0,0.22), 0 6px 20px rgba(0,0,0,0.16);
  transition: transform 0.08s ease-out, box-shadow 0.08s ease-out;
  -webkit-tap-highlight-color: transparent;
  text-align: center;
  width: 100%;
}
.game-card:active:not([disabled]) {
  transform: translateY(4px);
  box-shadow: 0 0 0 rgba(0,0,0,0.22), 0 3px 8px rgba(0,0,0,0.14);
}
.game-card.coming-soon {
  background: rgba(255,255,255,0.2);
  box-shadow: none;
  cursor: default;
}

.card-emoji {
  font-size: clamp(32px, 10vmin, 52px);
  line-height: 1;
  display: block;
}

.card-title {
  font-size: clamp(11px, 2.8vmin, 15px);
  font-weight: 900;
  color: var(--text-dark);
  line-height: 1.25;
  display: block;
}

.card-subtitle {
  font-size: clamp(10px, 2.2vmin, 12px);
  color: #636e72;
  display: block;
  line-height: 1.3;
}

.game-card.coming-soon .card-title {
  color: rgba(255,255,255,0.65);
}

.card-badge {
  font-size: clamp(9px, 2vmin, 11px);
  font-weight: 700;
  background: rgba(255,255,255,0.2);
  color: rgba(255,255,255,0.8);
  border-radius: 20px;
  padding: 2px 8px;
  display: block;
  white-space: nowrap;
}

/* ===== GAME IFRAME SCREEN ===== */
#screen-game { flex-direction: column; }

.game-frame {
  border: none;
  width: 100%;
  height: 100%;
  flex: 1;
  display: block;
}

.portal-back-btn {
  touch-action: manipulation;
  position: fixed;
  bottom: max(14px, env(safe-area-inset-bottom));
  left: max(14px, env(safe-area-inset-left));
  background: rgba(0,0,0,0.45);
  color: var(--white);
  border: none;
  border-radius: 20px;
  font-size: clamp(13px, 3vmin, 16px);
  font-weight: 700;
  padding: 0.5em 1.2em;
  cursor: pointer;
  z-index: 200;
  display: flex;
  align-items: center;
  gap: 0.4em;
  -webkit-tap-highlight-color: transparent;
  backdrop-filter: blur(4px);
  -webkit-backdrop-filter: blur(4px);
}
.portal-back-btn:active { transform: scale(0.95); }

/* ===== ERROR STATE ===== */
.load-error {
  color: rgba(255,255,255,0.85);
  font-size: clamp(14px, 3.5vmin, 18px);
  font-weight: 700;
  text-align: center;
  padding: 8vmin 4vmin;
  grid-column: 1 / -1;
}

/* reduced motion */
@media (prefers-reduced-motion: reduce) {
  body::before { display: none; }
  .portal-mascot { animation: none !important; }
  .game-card:active:not([disabled]) { transform: none !important; }
}
</style>
</head>
<body>

<!-- PORTAL SCREEN -->
<div id="screen-portal" class="screen active">
  <div class="portal-header">
    <span class="portal-mascot" aria-hidden="true">🦊</span>
    <div class="portal-title">こどもゲーム</div>
    <div class="portal-subtitle">あそびたいゲームをえらんでね！</div>
  </div>
  <div id="game-grid" class="game-grid" role="list" aria-label="ゲーム一覧"></div>
</div>

<!-- GAME IFRAME SCREEN -->
<div id="screen-game" class="screen">
  <iframe id="game-frame" class="game-frame" src="" title="ゲーム" allow="autoplay" allowfullscreen></iframe>
  <button id="btn-back" class="portal-back-btn" aria-label="いちらんにもどる">🏠 もどる</button>
</div>

<script>
'use strict';

const screenPortal = document.getElementById('screen-portal');
const screenGame   = document.getElementById('screen-game');
const gameFrame    = document.getElementById('game-frame');
const gameGrid     = document.getElementById('game-grid');
const btnBack      = document.getElementById('btn-back');

function showPortal() {
  screenGame.classList.remove('active');
  screenPortal.classList.add('active');
  gameFrame.src = '';
}

function showGame(path) {
  screenPortal.classList.remove('active');
  gameFrame.src = path;
  screenGame.classList.add('active');
}

// postMessage from game iframe: verify origin and source before closing
window.addEventListener('message', (e) => {
  if (e.source !== gameFrame.contentWindow) return;
  if (e.origin !== location.origin) return;
  if (e.data && e.data.type === 'go-home') showPortal();
});

btnBack.addEventListener('click', showPortal);

// Render game cards from games.json
function renderGrid(games) {
  gameGrid.innerHTML = '';
  games.forEach((game) => {
    const isLive = game.status === 'live';
    const card = document.createElement('button');
    card.className = 'game-card' + (isLive ? '' : ' coming-soon');
    card.setAttribute('role', 'listitem');
    card.disabled = !isLive;
    if (!isLive) card.setAttribute('aria-disabled', 'true');

    const detailHtml = isLive
      ? `<span class="card-subtitle">${game.subtitle}</span>`
      : `<span class="card-badge">ちかぢか こうかい</span>`;

    card.innerHTML =
      `<span class="card-emoji" aria-hidden="true">${game.emoji}</span>` +
      `<span class="card-title">${game.title}</span>` +
      detailHtml;

    if (isLive && game.path) {
      card.addEventListener('click', () => showGame(game.path));
    }
    gameGrid.appendChild(card);
  });
}

// Load games.json; fetch() requires HTTP server (not file://)
(async () => {
  try {
    const res = await fetch('games.json');
    if (!res.ok) throw new Error(`HTTP ${res.status}`);
    const games = await res.json();
    renderGrid(games);
  } catch (e) {
    gameGrid.innerHTML =
      '<p class="load-error">ゲームの よみこみに しっぱいしました 😢</p>';
  }
})();
</script>
</body>
</html>
