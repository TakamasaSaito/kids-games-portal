<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#667eea"/>
      <stop offset="100%" stop-color="#764ba2"/>
    </linearGradient>
  </defs>

  <!-- 背景 -->
  <rect width="512" height="512" rx="100" ry="100" fill="url(#bg)"/>

  <!-- タイル A: 左上 (「あ」) -->
  <rect x="56" y="56" width="186" height="186" rx="32" ry="32" fill="white" opacity="0.95"/>
  <!-- あ の字 -->
  <text x="149" y="184" font-family="serif" font-size="120" font-weight="900" text-anchor="middle" fill="#764ba2">あ</text>

  <!-- タイル B: 右上 (「1 2」) -->
  <rect x="270" y="56" width="186" height="186" rx="32" ry="32" fill="white" opacity="0.95"/>
  <!-- 1 と 2 -->
  <text x="316" y="178" font-family="sans-serif" font-size="100" font-weight="900" text-anchor="middle" fill="#f97316">1</text>
  <text x="410" y="178" font-family="sans-serif" font-size="100" font-weight="900" text-anchor="middle" fill="#f97316">2</text>

  <!-- タイル C: 左下 (大小の円) -->
  <rect x="56" y="270" width="186" height="186" rx="32" ry="32" fill="white" opacity="0.95"/>
  <!-- 大きい円 -->
  <circle cx="122" cy="363" r="50" fill="none" stroke="#764ba2" stroke-width="14"/>
  <!-- 小さい円 -->
  <circle cx="208" cy="363" r="30" fill="none" stroke="#764ba2" stroke-width="14"/>

  <!-- タイル D: 右下 (「?」) -->
  <rect x="270" y="270" width="186" height="186" rx="32" ry="32" fill="white" opacity="0.95"/>
  <!-- ? マーク -->
  <text x="363" y="406" font-family="sans-serif" font-size="130" font-weight="900" text-anchor="middle" fill="#667eea">?</text>
</svg>
