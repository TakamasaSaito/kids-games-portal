<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#667eea"/>
      <stop offset="100%" stop-color="#764ba2"/>
    </linearGradient>
    <linearGradient id="card2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#a78bfa"/>
      <stop offset="100%" stop-color="#8b5cf6"/>
    </linearGradient>
    <linearGradient id="card3" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#c4b5fd"/>
      <stop offset="100%" stop-color="#a78bfa"/>
    </linearGradient>
  </defs>

  <!-- 背景 -->
  <rect width="512" height="512" rx="100" ry="100" fill="url(#bg)"/>

  <!-- カード3枚目(いちばん後ろ) 少し右上にずらす -->
  <rect x="140" y="68" width="280" height="340" rx="36" ry="36" fill="url(#card3)" opacity="0.7" transform="rotate(10,280,238)"/>

  <!-- カード2枚目(中間) -->
  <rect x="116" y="88" width="280" height="340" rx="36" ry="36" fill="url(#card2)" opacity="0.85" transform="rotate(-5,256,258)"/>

  <!-- カード1枚目(手前、白) -->
  <rect x="96" y="108" width="280" height="340" rx="36" ry="36" fill="white" opacity="0.96"/>

  <!-- 手前カードに🦊の顔(図形で描く) -->
  <!-- 顔の円 -->
  <circle cx="236" cy="248" r="88" fill="#fde68a"/>

  <!-- 耳 左 -->
  <polygon points="168,178 196,122 224,184" fill="#fde68a"/>
  <polygon points="178,175 196,136 216,178" fill="#f97316"/>

  <!-- 耳 右 -->
  <polygon points="304,178 276,122 248,184" fill="#fde68a"/>
  <polygon points="294,175 276,136 256,178" fill="#f97316"/>

  <!-- 目 左 -->
  <ellipse cx="208" cy="236" rx="14" ry="17" fill="#1e1b4b"/>
  <ellipse cx="213" cy="230" rx="5" ry="5" fill="white"/>

  <!-- 目 右 -->
  <ellipse cx="264" cy="236" rx="14" ry="17" fill="#1e1b4b"/>
  <ellipse cx="269" cy="230" rx="5" ry="5" fill="white"/>

  <!-- 鼻 -->
  <ellipse cx="236" cy="266" rx="10" ry="7" fill="#f97316"/>

  <!-- 口 -->
  <path d="M208,284 Q236,308 264,284" stroke="#92400e" stroke-width="7" fill="none" stroke-linecap="round"/>

  <!-- ほっぺ -->
  <ellipse cx="186" cy="262" rx="18" ry="11" fill="#fca5a5" opacity="0.5"/>
  <ellipse cx="286" cy="262" rx="18" ry="11" fill="#fca5a5" opacity="0.5"/>

  <!-- カード下部に小さいドット(ゲームぽさ演出) -->
  <circle cx="186" cy="398" r="8" fill="#764ba2" opacity="0.3"/>
  <circle cx="216" cy="398" r="8" fill="#764ba2" opacity="0.3"/>
  <circle cx="246" cy="398" r="8" fill="#764ba2" opacity="0.3"/>
  <circle cx="276" cy="398" r="8" fill="#764ba2" opacity="0.3"/>
  <circle cx="306" cy="398" r="8" fill="#764ba2" opacity="0.3"/>
</svg>
